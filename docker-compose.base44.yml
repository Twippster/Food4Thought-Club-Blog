# Base44 development environment for the Food4Thought pnpm monorepo.
# Frontend (Vite) is the public entry on port 3000; the Express API is reached
# via the Vite dev-server proxy (single origin). PostgreSQL runs locally.
services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: f4t
      POSTGRES_PASSWORD: f4t
      POSTGRES_DB: f4t
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f4t -d f4t"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # One-shot: install workspace dependencies into the bind-mounted source so
  # every other service shares the same node_modules without concurrent installs.
  deps:
    build:
      context: .
      dockerfile: .base44/Dockerfile
    volumes:
      - .:/app
    command: ["sh", "-ec", "pnpm install --frozen-lockfile"]
    restart: "no"

  # One-shot: push the Drizzle schema so the API can seed and serve stories.
  migrate:
    build:
      context: .
      dockerfile: .base44/Dockerfile
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://f4t:f4t@db:5432/f4t
    command: ["sh", "-ec", "pnpm --filter @workspace/db run push"]
    depends_on:
      db:
        condition: service_healthy
      deps:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: .base44/Dockerfile
    volumes:
      - .:/app
    environment:
      PORT: "5000"
      DATABASE_URL: postgresql://f4t:f4t@db:5432/f4t
      NODE_ENV: development
    command: ["sh", "-ec", "exec pnpm --filter @workspace/api-server run dev"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: .base44/Dockerfile
    volumes:
      - .:/app
    environment:
      PORT: "3000"
      BASE_PATH: "/"
      NODE_ENV: development
      API_PROXY_TARGET: http://api:5000
    ports:
      - "3000:3000"
    command: ["sh", "-ec", "exec pnpm --filter @workspace/food4thought run dev"]
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  db-data:
